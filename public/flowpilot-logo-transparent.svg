  />

  <!-- Connected Workflow Nodes -->
  <circle cx="20" cy="79" r="5.5" fill="#38BDF8" />
  <circle cx="104" cy="22" r="5.5" fill="url(#fpCoreGlow)" />
  <circle cx="52" cy="66" r="4.5" fill="#FFFFFF" />
</svg>
